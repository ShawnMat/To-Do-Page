<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/styles/SampleDashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid d-flex p-0">
        <div class="sidebar">
            <div class="Main-logo d-flex p-4 ">
                <img src="/icons/To Doist Logo.png" class="Logo">
                <h5 class="d-flex align-items-center px-3">To Doist</h5>
            </div>
            <div class="menu ps-4">
                <p>Menu</p>
                <div class="menu-text d-flex gap-2">
                    <i class="bi bi-grid"></i>
                    <p>Dashboard</p>
                </div>
                <div class="Mytask-text d-flex gap-2">
                    <i class="bi bi-check2-square"></i>
                    <p>My Tasks</p>
                </div>
                <div class="calendar-text d-flex gap-2">
                    <i class="bi bi-calendar"></i>
                    <p>Calendar</p>
                </div>
            </div>
        </div>
        <nav>
            <div class="navbar-header px-5 py-4">Today's Date </div>
        </nav>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
