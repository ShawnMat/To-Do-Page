<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/styles/SampleDashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid d-flex  p-0">
        <div class="sidebar gap-5">
            <div class="sideOne">
                <div class="Main-logo d-flex p-4 ">
                    <img src="/icons/To Doist Logo.png" class="Logo">
                    <h5 class="d-flex align-items-center px-3">To Doist</h5>
                </div>
                <div class="menu ps-4">
                    <p>Menu</p>
                    <div class="menu-text d-flex gap-2">
                        <i class="bi bi-grid"></i>
                        <p>Dashboard</p>
                    </div>
                    <div class="Mytask-text d-flex gap-2">
                        <i class="bi bi-check2-square"></i>
                        <p>My Tasks</p>
                    </div>
                    <div class="calendar-text d-flex gap-2">
                        <i class="bi bi-calendar"></i>
                        <p>Calendar</p>
                    </div>
                </div>
            </div>
            <div class="sideTwo ps-4">
                <p>Profile</p>
                <div class="profile d-flex gap-2">
                    <i class="bi bi-person-square"></i>
                    <p>UserName</p>
                </div>
            </div>
        </div>
        <div class="workspace ">
            <div class="nav ">
                <div class="navbar-header d-flex justify-content-between px-5 py-4">
                    Today's Date
                    <div class="btns">
                        <button class="rounded-1" data-bs-toggle="modal" data-bs-target="#addTaskModal" type="button">
                            <i class="bi bi-plus-square-fill"></i>
                            Add Task
                        </button>
                        <button class="rounded-1" onclick="showDeletedTasks()" type="button">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Restore
                        </button>
                        <button class="rounded-1" onclick="logout()" type="button">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
            <div class="summary d-flex justify-content-around mt-4">
                <div class="totaltasks rounded-1" id="summary-val">
                    <div class="totaltasks-cont">
                        <i class="bi bi-list"></i>
                        Total
                    </div>
                    <p id="totalNumber"></p>
                </div>
                <div class="completed rounded-1" id="summary-val">
                    <div class="completed-cont">
                        <i class="bi bi-check2-square"></i>
                        Completed
                    </div>
                    <p id="completedNum"></p> 
                </div>
                <div class="inprogress rounded-1" id="summary-val">
                    <div class="inprogress-cont">
                        <i class="bi bi-hourglass-split"></i>
                        InProgress
                    </div>
                    <p id=""></p>
                </div>
                <div class="overDue rounded-1 " id="summary-val">
                    <div class="overDue-cont">
                        <i class="bi bi-list"></i>
                        OverDue
                    </div>
                </div>
            </div>
            <div class="showTasks rounded-1 p-3">
                <div class="heading d-flex justify-content-between">
                    <p>My Tasks</p>
                    <div class="priority-filters d-flex">
                        <div class="priority-border d-flex align-items-center justify-content-center rounded-1">
                            <div class="priority-btns">
                                <button id="p-btns">High</button>
                                <button id="p-btns">Medium</button>
                                <button id="p-btns">Low</button>
                            </div>
                        </div>
                    </div>
                </div>
                <p id="showBorder"></p>
                <!-- Task List -->
                <div class="taskList d-flex">
                    <div class="card w-100 bg-primary rounded-1">
                        <input type="checkbox" id="taskCheckbox">
                        <h5>${task.taskName}</h5>
                        <h5>${task.taskDesc}</h5>
                        <p>${task.startDate}</p>
                        <p>${task.dueDate}</p>
                        <p>${task.status}</p>
                        <span class="badge bg-secondary">${task.priority}</span>
                    </div>
                </div>


            </div>

        </div>
    </div>
    <div class="modal fade" id="addTaskModal"> 
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Add Task</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                        <input
                    class="form-control mb-2"
                    id="taskNameInput"
                    placeholder="Task Name">

                <textarea
                    class="form-control mb-2"
                    id="taskDescInput"
                    placeholder="Description">
                </textarea>

                <input
                    class="form-control mb-2"
                    id="taskStartInput"
                    placeholder="Start Date"
                    onfocus="this.type='date'"
                    onblur="if(!this.value)this.type='text'">

                <input
                    class="form-control mb-2"
                    id="taskDueInput"
                    placeholder="Due Date"
                    onfocus="this.type='date'"
                    onblur="if(!this.value)this.type='text'">

                <select
                    class="form-select mb-2"
                    id="priority">

                    <option disabled selected>
                        Choose Priority
                    </option>

                    <option>High</option>
                    <option>Normal</option>
                    <option>Low</option>

                </select>

                <select
                    class="form-select mb-2"
                    id="status">

                    <option disabled selected>
                        Choose Status
                    </option>

                    <option>Not Started</option>
                    <option>Pending</option>
                    <option>Completed</option>

                </select>

                <button
                    class="btn btn-primary w-100"
                    id="addTaskBtn">

                    Submit

                </button>
                </div>
            </div>
        </div>
    </div>

    



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/SampleDashboard.js"></script>
</body>
</html>
