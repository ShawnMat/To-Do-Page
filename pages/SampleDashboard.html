<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/styles/SampleDashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid d-flex  p-0">
        <div class="sidebar gap-5">
            <div class="sideOne">
                <div class="Main-logo d-flex p-4 ">
                    <img src="/icons/To Doist Logo.png" class="Logo">
                    <h5 class="d-flex fw-bold align-items-center px-3" style="color: #1F2937;">To Doist</h5>
                </div>
                <div class="menu ps-4">
                    <p class="fw-bold" >Menu</p>
                    <button class="btn menu-text d-flex gap-2" type="button">
                        <i class="bi bi-grid"></i>
                        <p class="menu-text"> Dashboard</p>
                    </button>   
                    <button class=" btn filterByDate d-flex gap-2 mb-3" data-bs-toggle="modal" data-bs-target="#filterDateModal">
                        <i class="bi bi-calendar-date"></i>
                        Filter by Date
                    </button>
                    <button
                        class="btn calendar-text d-flex gap-2"
                        data-bs-toggle="modal"
                        data-bs-target="#calendarModal">
                        <i class="bi bi-calendar"></i>
                        <p class="menu-text">Calendar</p>
                    </button>
                </div>
            </div>
            <div class="sideTwo ps-4">
                <p class="menu-text fw-bold">Profile</p>
                <button class="btn profile d-flex gap-2" type="button">
                    <i class="bi bi-person-square"></i>
                    <p id="userNameVal"></p>
                </button>
                <button class="btn rounded-1 d-flex gap-2" onclick="logout()" id="logoutBtn" type="button">
                    <i class="bi bi-box-arrow-left"></i>
                    <p class="menu-text">Logout</p>
                </button>
            </div>
        </div>
        <div class="workspace ">
            <div class="nav ">
                <div class="navbar-header d-flex justify-content-between px-5 py-4">
                    Today's Date
                    
                    <div class="btns d-flex">
                        <button class=" btn rounded-1" data-bs-toggle="modal" data-bs-target="#addTaskModal" type="button">
                            <i class="bi bi-plus-square-fill"></i>
                            Add Task
                        </button>
                        
                        <button class="btn rounded-1" onclick="showDeletedTasks()" type="button">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Restore
                        </button>
                        <button class="btn" id="allTaskbtn">
                            <i class="bi bi-card-checklist"></i>
                            All Tasks
                        </button>
                        
                    </div>
                </div>
            </div>
            <div class="content-cont">
                <div class="summary d-flex justify-content-around mt-4">
                    <button class="totaltasks rounded-1" data-bs-toggle="modal" data-bs-target="#totalTasksModal" style="background-color: #7ab8a2;" id="summary-val">
                        <div class="totaltasks-cont d-flex gap-2">
                            <i class="bi bi-list"></i>
                            <p class="fw-bold" >Total</p>
                        </div>
                        <p class="fs-1" id="totalNumber"></p>
                    </button>
                    <button class="completed rounded-1" data-bs-toggle="modal" data-bs-target="#completedModal" style="background-color: #7ab8a2;" id="summary-val">
                        <div class="completed-cont d-flex gap-2">
                            <i class="bi bi-check2-square"></i>
                            <p class="fw-bold">Completed</p>
                        </div>
                        <p class="fs-1" id="completedNum"></p>
                    </button>
                    <button class="inprogress rounded-1 " data-bs-toggle="modal" data-bs-target="#inProgressModal" style="background-color: #7ab8a2;" id="summary-val">
                        <div class="inprogress-cont  d-flex gap-2">
                            <i class="bi bi-hourglass-split"></i>
                            <p class="fw-bold">InProgress</p>
                        </div>
                        <p class="fs-1" id="inprogressNum"></p>
                    </button>
                    <button class="notStarted rounded-1" data-bs-toggle="modal" data-bs-target="#notStartedModal" style="background-color: #7ab8a2;" id="summary-val">
                        <div class="notStarted-cont d-flex gap-2 ">
                            <i class="bi bi-pause-circle"></i>
                            <p class="fw-bold">Not Started</p>
                        </div>
                        <p class="fs-1" id="notStartedNum"></p>
                    </button>
                    <button class="overDue rounded-1 " data-bs-toggle="modal" data-bs-target="#overDueModal" style="background-color: #7ab8a2;" id="summary-val">
                        <div class="overDue-cont d-flex gap-2">
                            <i class="bi bi-clock-history "></i>
                            <p class="fw-bold">OverDue</p>
                        </div>
                        <p class="fs-1" id="overdueNum"></p>
                    </button>
                </div>
                <div class="showTasks rounded-1 p-3">
                    <div class="heading d-flex justify-content-between">
                        <p class="fw-bold fs-5">My Tasks</p>
                        <div class="priority-filters d-flex">
                            <div class="priority-border d-flex align-items-center justify-content-center rounded-1">
                                <div class="priority-btns">
                                    <button id="p-btns">All Tasks</button>
                                    <button id="p-btns">High</button>
                                    <button id="p-btns">Medium</button>
                                    <button id="p-btns">Low</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p id="showBorder"></p>
                    <!-- Task List -->
                    <div class="taskList ">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- <div id="calendar" style="display: none;"></div> -->

    <div class="modal fade" id="calendarModal">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Calendar</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="calendar"></div>
            </div>
        </div>
    </div>
</div>

    <div class="modal fade" id="addTaskModal"> 
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="fw-bold">Add Task</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input class="form-control mb-2" id="taskNameInput" placeholder="Task Name">
                    <p class="taskNameError"></p>
                    <textarea class="form-control mb-2" id="taskDescInput" placeholder="Description"></textarea>
                    <p class="textAreaError"></p>

                <input class="form-control mb-2" id="taskDueInput" placeholder="Due Date" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
                <p class="taskDueInputError"></p>
                <select class="form-select mb-2" id="priority">
                

                    <option disabled selected>
                        Choose Priority
                    </option>

                    <!-- <option>All Tasks</option> -->
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>

                </select>
                <p class="priorityError"></p>
                <select class="form-select mb-2" id="status">

                    <option disabled selected>
                        Choose Status
                    </option>

                    <option>Not Started</option>
                    <option>Pending</option>
                    <option>Completed</option>

                </select>
                <p class="statusError"></p>
                <button class="btn btn-primary w-100" id="submitTaskBtn" >
                    Submit
                </button>
                </div>
            </div>
        </div>
    </div>
    <!-- edit -->
    <div class="modal fade" id="editTaskModal"> 
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="fw-bold">Edit Task</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                        <input
                    class="form-control mb-2"
                    id="EtaskNameInput"
                    placeholder="Task Name">

                <textarea
                    class="form-control mb-2"
                    id="EtaskDescInput"
                    placeholder="Description">
                </textarea>

                
                <input
                    class="form-control mb-2"
                    id="EtaskDueInput"
                    placeholder="Due Date"
                    onfocus="this.type='date'"
                    onblur="if(!this.value)this.type='text'">

                <select
                    class="form-select mb-2"
                    id="Epriority">

                    <option disabled selected>
                        Choose Priority
                    </option>

                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>

                </select>

                <select
                    class="form-select mb-2"
                    id="Estatus">

                    <option disabled selected>
                        Choose Status
                    </option>

                    <option>Not Started</option>
                    <option>Pending</option>
                    <option>Completed</option>

                </select>

                <button
                    class="btn btn-primary w-100"
                    id="editTaskBtn" >
                
                    Submit

                </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="filterDateModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Filter Tasks By Date</h5>
                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">

                <label class="fw-bold mb-1">
                    Start Date
                </label>

                <input
                    type="date"
                    class="form-control mb-3"
                    id="filterStartDate">

                <label class="fw-bold mb-1">
                    Due Date
                </label>

                <input
                    type="date"
                    class="form-control mb-3"
                    id="filterDueDate">

                <p
                    class="text-danger"
                    id="filterDateError">
                </p>

                <button
                    class="btn btn-primary w-100"
                    id="applyDateFilter">

                    Apply Filter

                </button>
                <button
                    class="btn btn-secondary w-100 mt-2"
                    id="clearDateFilter">

                    Clear Filter

                </button>
            </div>

        </div>
    </div>
</div>
    

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/SampleDashboard.js"></script>
</body>
</html>
